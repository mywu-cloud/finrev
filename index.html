<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股月營收排行系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;background:#f5f6f8;color:#222;min-height:100vh}
/* Header */
.hdr{background:#fff;border-bottom:1px solid #dde1e7;padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.hdr h1{font-size:17px;font-weight:700;color:#1a1a2e;white-space:nowrap}
.hdr-date{font-size:13px;color:#888;margin-left:auto;white-space:nowrap}
/* Tabs */
.tabs{display:flex;background:#fff;border-bottom:2px solid #dde1e7;padding:0 20px}
.tab{padding:9px 18px;font-size:14px;font-family:inherit;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;color:#555;font-weight:500;margin-bottom:-2px;transition:color .15s,border-color .15s}
.tab:hover{color:#1a6fc4}
.tab.active{color:#1a6fc4;border-bottom-color:#1a6fc4;font-weight:700}
/* Toolbar */
.toolbar{background:#fff;padding:8px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #eee}
select,input[type=text]{font-family:inherit;font-size:14px;padding:4px 8px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#222;height:30px}
select:focus,input:focus{outline:none;border-color:#1a6fc4}
.sp{flex:1}
.btn{font-family:inherit;font-size:13px;padding:4px 12px;border:none;border-radius:4px;cursor:pointer;height:30px;font-weight:500;transition:background .15s;white-space:nowrap}
.btn-blue{background:#1a6fc4;color:#fff}.btn-blue:hover{background:#155aaa}
.btn-gray{background:#e8eaf0;color:#333}.btn-gray:hover{background:#d0d4de}
.btn-green{background:#2a9d5c;color:#fff}.btn-green:hover{background:#228048}
.btn-red{background:#e05252;color:#fff}.btn-red:hover{background:#c43a3a}
.btn-sm{padding:3px 9px;font-size:12px;height:24px}
/* Watch add row */
.watch-bar{background:#fff;padding:8px 20px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee}
.watch-bar input{width:110px}
/* Status */
.status{padding:5px 20px;font-size:13px;color:#555;background:#fafbfc;border-bottom:1px solid #eee;min-height:26px;line-height:16px}
.status.loading{color:#1a6fc4}
.status.error{color:#e05252}
/* Progress */
.progress{height:3px;background:#e8eaf0;display:none}
.progress-bar{height:3px;background:#1a6fc4;transition:width .2s;width:0%}
/* Table */
.tbl-wrap{overflow-x:auto;padding-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
thead tr{background:#f0f2f7}
th{padding:8px 11px;text-align:right;white-space:nowrap;font-weight:600;color:#333;border-bottom:2px solid #dde1e7;cursor:pointer;user-select:none;position:sticky;top:0;background:#f0f2f7;z-index:5}
th:hover{background:#e4e7f0}
th.l{text-align:left}
th.c{text-align:center}
.sort-icon{margin-left:3px;font-size:10px;color:#aaa}
th.sa .sort-icon,th.sd .sort-icon{color:#1a6fc4}
td{padding:7px 11px;border-bottom:1px solid #eeeff3;text-align:right;vertical-align:middle;white-space:nowrap}
td.l{text-align:left}
td.c{text-align:center}
tr:hover td{background:#f7f9fd}
.sid{font-weight:600;color:#1a6fc4}
.sname{font-weight:500}
.sind{font-size:12px;color:#999;margin-top:1px}
.up{color:#d9363e}
.down{color:#389d59}
.neu{color:#888}
.rank-n{color:#aaa;font-size:13px}
tfoot td{background:#f0f2f7;font-weight:600;border-top:2px solid #dde1e7;font-size:13px}
.empty{padding:40px 20px;text-align:center;color:#aaa;font-size:15px}
@media(max-width:700px){th,td{padding:6px 7px;font-size:13px}}
</style>
</head>
<body>
<div class="hdr">
  <h1>📊 台股月營收排行</h1>
  <span class="hdr-date" id="hdrDate">--</span>
</div>
<div class="tabs">
  <button class="tab active" id="tb-twse" onclick="switchTab('twse')">上市 (TWSE)</button>
  <button class="tab" id="tb-tpex" onclick="switchTab('tpex')">上櫃 (TPEx)</button>
  <button class="tab" id="tb-watch" onclick="switchTab('watch')">⭐ 自選股</button>
</div>
<div class="toolbar" id="toolMain">
  <label style="font-size:14px;color:#555;font-weight:500">產業：</label>
  <select id="indSel" onchange="onInd()">
    <option value="">全部產業</option>
  </select>
  <span class="sp"></span>
  <button class="btn btn-gray" onclick="dlCSV()">⬇ CSV</button>
  <button class="btn btn-gray" onclick="dlXLS()">⬇ XLS</button>
  <button class="btn btn-blue" onclick="loadData()">🔄 重新載入</button>
</div>
<div class="watch-bar" id="toolWatch" style="display:none">
  <input id="wInp" type="text" placeholder="股票代號（4碼）" maxlength="6"
    onkeydown="if(event.key==='Enter')addWatch()">
  <button class="btn btn-green" onclick="addWatch()">＋ 新增</button>
  <span class="sp"></span>
  <button class="btn btn-gray" onclick="dlCSV()">⬇ CSV</button>
  <button class="btn btn-gray" onclick="dlXLS()">⬇ XLS</button>
  <button class="btn btn-red btn-sm" onclick="clearWatch()">全部清除</button>
</div>
<div class="progress" id="prog"><div class="progress-bar" id="progBar"></div></div>
<div class="status" id="sta">初始化中...</div>
<div class="tbl-wrap">
  <table id="mainTbl">
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
    <tfoot id="tfoot"></tfoot>
  </table>
</div>
<script>
// ── COLUMNS ──
const COLS=[
  {k:'rank',     lb:'#',          al:'c', sort:true},
  {k:'stock_id', lb:'代號',       al:'c', sort:true},
  {k:'name',     lb:'名稱',       al:'l', sort:true},
  {k:'close',    lb:'收盤價',     al:'r', sort:true},
  {k:'change',   lb:'漲跌',       al:'r', sort:true},
  {k:'chgpct',   lb:'漲跌幅',     al:'r', sort:true},
  {k:'revenue',  lb:'月營收(億)', al:'r', sort:true},
  {k:'mom',      lb:'月增率',     al:'r', sort:true},
  {k:'yoy',      lb:'年增率',     al:'r', sort:true},
  {k:'cumrev',   lb:'累計營收',   al:'r', sort:true},
  {k:'cumyoy',   lb:'累計年增率', al:'r', sort:true},
];

// ── STATE ──
const S={
  tab:'twse',
  rows:{twse:[],tpex:[],watch:[]},
  sortK:'revenue', sortD:'desc',
  ind:'',
  watch: JSON.parse(localStorage.getItem('_tw_watch')||'[]'),
  dataMonth:'',
  loaded:{twse:false,tpex:false},
};

// ── UTILS ──
const pf=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:n};
const f2=v=>{if(v==null||isNaN(v))return'--';return parseFloat(v).toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2})};
const frev=v=>{if(v==null)return'--';const n=parseFloat(v)/1e8;return n.toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2})};
const fpct=v=>{if(v==null||isNaN(v))return'--';const n=parseFloat(v);return(n>0?'+':'')+n.toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'};
const cc=v=>{if(v==null||isNaN(v))return'neu';return parseFloat(v)>0?'up':parseFloat(v)<0?'down':'neu'};
const isValid=code=>/^[1-9][0-9]{3}$/.test(code);
const EXCL_NAMES=['ETF','存託憑證','特別股','受益憑證','指數','債券'];
const okName=n=>!EXCL_NAMES.some(w=>n.includes(w));

// ── FINMIND API ──
const FM='https://api.finmindtrade.com/api/v4/data';

async function getStockInfo(){
  const r=await fetch(FM+'?dataset=TaiwanStockInfo');
  const d=await r.json();
  return (d.data||[]).filter(s=>isValid(s.stock_id)&&okName(s.stock_name||''));
}

async function getRevenue(id,startDate){
  try{
    const r=await fetch(FM+'?dataset=TaiwanStockMonthRevenue&data_id='+id+'&start_date='+startDate);
    const d=await r.json();
    return d.status===200?(d.data||[]):[];
  }catch{return[]}
}

async function getPrice(id,startDate){
  try{
    const r=await fetch(FM+'?dataset=TaiwanStockPrice&data_id='+id+'&start_date='+startDate);
    const d=await r.json();
    return d.status===200?(d.data||[]):[];
  }catch{return[]}
}

// ── COMPUTE METRICS ──
function calcMetrics(revRows){
  // Sort by year+month asc
  const sorted=[...revRows].sort((a,b)=>a.revenue_year!==b.revenue_year?a.revenue_year-b.revenue_year:a.revenue_month-b.revenue_month);
  if(!sorted.length)return null;
  // Build map for easy lookup
  const map={};
  sorted.forEach(r=>{map[r.revenue_year+'_'+r.revenue_month]=r.revenue});
  // Latest
  const latest=sorted[sorted.length-1];
  const y=latest.revenue_year, m=latest.revenue_month;
  const rev=latest.revenue;
  // MoM
  const prevM=m>1?map[(y)+'_'+(m-1)]:map[(y-1)+'_12'];
  const mom=prevM?((rev-prevM)/Math.abs(prevM)*100):null;
  // YoY
  const prevY=map[(y-1)+'_'+m];
  const yoy=prevY?((rev-prevY)/Math.abs(prevY)*100):null;
  // Cumulative current year
  let cumRev=0;
  for(let i=1;i<=m;i++){const v=map[y+'_'+i];if(v)cumRev+=v}
  // Cumulative prev year same period
  let cumPrev=0;
  for(let i=1;i<=m;i++){const v=map[(y-1)+'_'+i];if(v)cumPrev+=v}
  const cumYoy=cumPrev?((cumRev-cumPrev)/Math.abs(cumPrev)*100):null;
  return{rev, mom:mom!=null?parseFloat(mom.toFixed(2)):null, yoy:yoy!=null?parseFloat(yoy.toFixed(2)):null, cumRev:cumRev||null, cumYoy:cumYoy!=null?parseFloat(cumYoy.toFixed(2)):null, y, m};
}

// ── LOAD DATA ──
async function loadData(){
  const tab=S.tab;
  if(tab==='watch'){loadWatch();return}

  setStatus('取得股票清單...','loading');
  showProg(5);

  let allInfo;
  try{
    allInfo=await getStockInfo();
  }catch(e){
    setStatus('股票清單取得失敗：'+e.message,'error');
    hideProg();return;
  }

  // Filter by market type
  const typeKey=tab==='twse'?'twse':'tpex';
  const stockList=allInfo.filter(s=>s.type===typeKey);
  setStatus('取得 '+stockList.length+' 支'+tab.toUpperCase()+'股票，載入月營收中...','loading');
  showProg(10);

  // Date range: need 13 months for MoM+YoY+cumulative
  const now=new Date();
  const start=new Date(now.getFullYear()-1,now.getMonth()-1,1);
  const startDate=start.getFullYear()+'-'+(String(start.getMonth()+1).padStart(2,'0'))+'-01';
  const priceStart=now.getFullYear()+'-'+(String(now.getMonth()+1).padStart(2,'0'))+'-01';

  // Fetch revenue for all stocks in parallel batches
  const BATCH=25;
  const rows=[];
  let done=0;

  for(let i=0;i<stockList.length;i+=BATCH){
    const batch=stockList.slice(i,i+BATCH);
    const batchRes=await Promise.all(batch.map(async s=>{
      const revRows=await getRevenue(s.stock_id,startDate);
      const metrics=calcMetrics(revRows);
      if(!metrics)return null;
      return{
        stock_id:s.stock_id, name:s.stock_name,
        industry:s.industry_category||'',
        close:null, change:null, chgpct:null,
        revenue:metrics.rev, mom:metrics.mom, yoy:metrics.yoy,
        cumrev:metrics.cumRev, cumyoy:metrics.cumYoy,
        y:metrics.y, m:metrics.m,
      };
    }));
    batchRes.forEach(r=>{if(r)rows.push(r)});
    done+=batch.length;
    const pct=10+Math.round(done/stockList.length*80);
    showProg(pct);
    setStatus('載入中 '+done+'/'+stockList.length+'... 已有 '+rows.length+' 筆營收資料','loading');
    // Render progressively every 100 stocks
    if(rows.length>0&&done%100===0){
      S.rows[tab]=[...rows];
      if(S.tab===tab){populateInd(tab);renderTable(getRows());}
    }
  }

  // Get closing prices (batch by stock)
  setStatus('取得收盤價格...','loading');
  showProg(90);
  const priceRows=await Promise.all(rows.map(async r=>{
    const prices=await getPrice(r.stock_id, priceStart);
    if(prices.length){
      const last=prices[prices.length-1];
      r.close=last.close;
      const prev=prices.length>1?prices[prices.length-2]:null;
      if(prev&&prev.close){r.change=parseFloat((last.close-prev.close).toFixed(2));r.chgpct=parseFloat((r.change/prev.close*100).toFixed(2))}
    }
    return r;
  }).slice(0,100)); // limit price fetches to top 100 by revenue to stay fast

  // Sort rows by revenue to find latest month
  rows.sort((a,b)=>b.revenue-a.revenue);
  if(rows.length){
    const top=rows[0];
    S.dataMonth=top.y+'年'+top.m+'月';
    document.getElementById('hdrDate').textContent='資料月份：'+S.dataMonth;
  }

  S.rows[tab]=rows;
  S.loaded[tab]=true;
  hideProg();
  populateInd(tab);
  renderTable(getRows());
  updateStatus();
}

// ── WATCHLIST ──
async function loadWatch(){
  const ids=S.watch;
  if(!ids.length){S.rows.watch=[];renderTable([]);setStatus('自選股（0）：尚未新增任何股票');return}
  setStatus('載入自選股 '+ids.length+' 支...','loading');showProg(5);
  let allInfo;
  try{allInfo=await getStockInfo();}catch(e){setStatus('取得股票資訊失敗','error');hideProg();return}
  const infoMap={};allInfo.forEach(s=>{infoMap[s.stock_id]=s});

  const now=new Date();
  const start=new Date(now.getFullYear()-1,now.getMonth()-1,1);
  const startDate=start.getFullYear()+'-'+(String(start.getMonth()+1).padStart(2,'0'))+'-01';
  const priceStart=now.getFullYear()+'-'+(String(now.getMonth()+1).padStart(2,'0'))+'-01';
  showProg(20);

  const rows=await Promise.all(ids.map(async id=>{
    const info=infoMap[id];
    const [revRows,prices]=await Promise.all([
      getRevenue(id,startDate),
      getPrice(id,priceStart),
    ]);
    const metrics=calcMetrics(revRows);
    const lastPrice=prices.length?prices[prices.length-1]:null;
    const prevPrice=prices.length>1?prices[prices.length-2]:null;
    let close=null,change=null,chgpct=null;
    if(lastPrice){
      close=lastPrice.close;
      if(prevPrice&&prevPrice.close){change=parseFloat((close-prevPrice.close).toFixed(2));chgpct=parseFloat((change/prevPrice.close*100).toFixed(2))}
    }
    return{
      stock_id:id,
      name:info?info.stock_name:'（未知）',
      industry:info?info.industry_category:'',
      close, change, chgpct,
      revenue:metrics?metrics.rev:null,
      mom:metrics?metrics.mom:null,
      yoy:metrics?metrics.yoy:null,
      cumrev:metrics?metrics.cumRev:null,
      cumyoy:metrics?metrics.cumYoy:null,
    };
  }));
  S.rows.watch=rows;
  hideProg();renderTable(getRows());setStatus('自選股：'+rows.length+' 支，資料月份：'+S.dataMonth);
}

function saveWatch(){localStorage.setItem('_tw_watch',JSON.stringify(S.watch))}
function addWatch(){
  const inp=document.getElementById('wInp');
  const code=inp.value.trim().toUpperCase();inp.value='';
  if(!code)return;
  if(!isValid(code)){alert('請輸入4碼數字股票代號');return}
  if(S.watch.includes(code)){alert(code+' 已在自選股');return}
  S.watch.push(code);saveWatch();
  if(S.tab==='watch')loadWatch();
}
function removeWatch(code){S.watch=S.watch.filter(id=>id!==code);saveWatch();if(S.tab==='watch')loadWatch()}
function clearWatch(){if(!confirm('確定清除全部自選股？'))return;S.watch=[];saveWatch();S.rows.watch=[];renderTable([]);setStatus('自選股已清空')}

// ── RENDER ──
function getRows(){
  let rows=[...(S.rows[S.tab]||[])];
  if((S.tab==='twse'||S.tab==='tpex')&&S.ind)rows=rows.filter(r=>r.industry===S.ind);
  rows.sort((a,b)=>{
    const ak=S.sortK, dir=S.sortD==='asc'?1:-1;
    if(ak==='name'){const av=a.name||'',bv=b.name||'';return dir*av.localeCompare(bv,'zh-TW')}
    if(ak==='stock_id'){return dir*(a.stock_id||'').localeCompare(b.stock_id||'')}
    const av=a[ak],bv=b[ak];
    if(av==null)return 1;if(bv==null)return -1;
    return dir*(parseFloat(av)-parseFloat(bv));
  });
  return rows;
}

function populateInd(tab){
  const sel=document.getElementById('indSel');
  const rows=S.rows[tab]||[];
  const inds=[...new Set(rows.map(r=>r.industry).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-TW'));
  sel.innerHTML='<option value="">全部產業</option>';
  inds.forEach(ind=>{const o=document.createElement('option');o.value=ind;o.textContent=ind;if(ind===S.ind)o.selected=true;sel.appendChild(o)});
}

function renderHead(){
  const tr=document.createElement('tr');
  COLS.forEach(col=>{
    const th=document.createElement('th');
    th.className=col.al;
    if(col.sort){
      th.style.cursor='pointer';
      th.onclick=()=>doSort(col.k);
      if(S.sortK===col.k)th.classList.add(S.sortD==='asc'?'sa':'sd');
    }
    const ico=col.sort?(S.sortK===col.k?(S.sortD==='asc'?'▲':'▼'):'⇅'):'';
    th.innerHTML=col.lb+'<span class="sort-icon">'+ico+'</span>';
    tr.appendChild(th);
  });
  const thead=document.getElementById('thead');
  thead.innerHTML='';thead.appendChild(tr);
}

function renderBody(rows){
  const tbody=document.getElementById('tbody');
  if(!rows.length){tbody.innerHTML='<tr><td colspan="'+COLS.length+'" class="empty">無資料</td></tr>';return}
  const f=document.createDocumentFragment();
  rows.forEach((row,idx)=>{
    const tr=document.createElement('tr');
    COLS.forEach(col=>{
      const td=document.createElement('td');
      td.className=col.al;
      switch(col.k){
        case'rank':td.innerHTML='<span class="rank-n">'+(idx+1)+'</span>';break;
        case'stock_id':td.innerHTML='<span class="sid">'+row.stock_id+'</span>';break;
        case'name':
          td.className='l';
          td.innerHTML='<div class="sname">'+(row.name||'--')+'</div>'+(row.industry?'<div class="sind">'+row.industry+'</div>':'');break;
        case'close':td.textContent=row.close!=null?f2(row.close):'--';break;
        case'change':td.className='r '+cc(row.change);td.textContent=row.change!=null?((row.change>0?'+':'')+f2(row.change)):'--';break;
        case'chgpct':td.className='r '+cc(row.chgpct);td.textContent=fpct(row.chgpct);break;
        case'revenue':td.textContent=frev(row.revenue);break;
        case'mom':td.className='r '+cc(row.mom);td.textContent=fpct(row.mom);break;
        case'yoy':td.className='r '+cc(row.yoy);td.textContent=fpct(row.yoy);break;
        case'cumrev':td.textContent=frev(row.cumrev);break;
        case'cumyoy':td.className='r '+cc(row.cumyoy);td.textContent=fpct(row.cumyoy);break;
      }
      // Watch tab: add delete button on last column
      if(S.tab==='watch'&&col.k==='cumyoy'){
        const orig=td.textContent;
        const btn=document.createElement('button');
        btn.className='btn btn-red btn-sm';btn.style.marginLeft='6px';btn.textContent='✕';
        btn.onclick=e=>{e.stopPropagation();removeWatch(row.stock_id)};
        td.textContent='';
        const sp=document.createElement('span');sp.textContent=orig;
        td.appendChild(sp);td.appendChild(btn);
      }
      tr.appendChild(td);
    });
    f.appendChild(tr);
  });
  tbody.innerHTML='';tbody.appendChild(f);
}

function renderFoot(rows){
  const tf=document.getElementById('tfoot');
  if(!rows.length){tf.innerHTML='';return}
  const totRev=rows.reduce((s,r)=>r.revenue?(s+r.revenue):s,0);
  const yoys=rows.filter(r=>r.yoy!=null).map(r=>r.yoy);
  const avgYoy=yoys.length?yoys.reduce((a,b)=>a+b,0)/yoys.length:null;
  const up=rows.filter(r=>r.yoy!=null&&r.yoy>0).length;
  const dn=rows.filter(r=>r.yoy!=null&&r.yoy<0).length;
  const tr=document.createElement('tr');
  COLS.forEach((col,i)=>{
    const td=document.createElement('td');td.className=col.al;
    if(i===1)td.textContent='合計/平均';
    else if(col.k==='revenue')td.textContent=frev(totRev);
    else if(col.k==='yoy'){td.textContent=avgYoy!=null?fpct(avgYoy)+' 均':'-';td.className='r '+cc(avgYoy)}
    else if(col.k==='mom')td.textContent='▲'+up+' ▼'+dn;
    else td.textContent='';
    tr.appendChild(td);
  });
  tf.innerHTML='';tf.appendChild(tr);
}

function renderTable(rows){renderHead();renderBody(rows);renderFoot(rows)}

function doSort(k){if(S.sortK===k)S.sortD=S.sortD==='asc'?'desc':'asc';else{S.sortK=k;S.sortD='desc'}renderTable(getRows())}
function onInd(){S.ind=document.getElementById('indSel').value;renderTable(getRows());updateStatus()}

function updateStatus(){
  const rows=getRows();
  const label=S.tab==='twse'?'上市':S.tab==='tpex'?'上櫃':'自選股';
  setStatus(label+'：共 '+rows.length+' 檔，資料月份：'+(S.dataMonth||'--'));
}
function setStatus(msg,cls){const b=document.getElementById('sta');b.textContent=msg;b.className='status '+(cls||'')}
function showProg(pct){const p=document.getElementById('prog');p.style.display='block';document.getElementById('progBar').style.width=pct+'%'}
function hideProg(){const p=document.getElementById('prog');p.style.display='none';document.getElementById('progBar').style.width='0%'}

function switchTab(tab){
  S.tab=tab;S.ind='';
  ['twse','tpex','watch'].forEach(t=>{document.getElementById('tb-'+t).classList.toggle('active',t===tab)});
  const isWatch=tab==='watch';
  document.getElementById('toolMain').style.display=isWatch?'none':'flex';
  document.getElementById('toolWatch').style.display=isWatch?'flex':'none';
  document.getElementById('indSel').value='';
  if(S.rows[tab]&&S.rows[tab].length>0){
    if(!isWatch)populateInd(tab);
    renderTable(getRows());updateStatus();
  }else{loadData()}
}

// ── DOWNLOAD ──
function getTableData(){
  const rows=getRows();
  const hdrs=COLS.map(c=>c.lb);
  const data=rows.map((r,i)=>[
    i+1, r.stock_id,
    (r.name||'')+(r.industry?' ('+r.industry+')':''),
    r.close!=null?parseFloat(r.close).toFixed(2):'',
    r.change!=null?((r.change>0?'+':'')+parseFloat(r.change).toFixed(2)):'',
    r.chgpct!=null?parseFloat(r.chgpct).toFixed(2)+'%':'',
    r.revenue!=null?(r.revenue/1e8).toFixed(2):'',
    r.mom!=null?parseFloat(r.mom).toFixed(2)+'%':'',
    r.yoy!=null?parseFloat(r.yoy).toFixed(2)+'%':'',
    r.cumrev!=null?(r.cumrev/1e8).toFixed(2):'',
    r.cumyoy!=null?parseFloat(r.cumyoy).toFixed(2)+'%':'',
  ]);
  return{hdrs,data};
}

function dlCSV(){
  const{hdrs,data}=getTableData();
  let csv='\uFEFF'+hdrs.join(',')+('\n');
  data.forEach(row=>{csv+=row.map(v=>{const s=String(v??'');return(s.includes(',')||s.includes('"')||s.includes('\n'))?'"'+s.replace(/"/g,'""')+'"':s}).join(',')+'\n'});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='台股月營收_'+(S.dataMonth||'data')+'.csv';a.click();
}

function dlXLS(){
  const{hdrs,data}=getTableData();
  let x='<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n<Worksheet ss:Name="月營收"><Table>\n';
  [hdrs,...data].forEach(row=>{
    x+='<Row>';
    row.forEach(v=>{x+='<Cell><Data ss:Type="String">'+String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</Data></Cell>'});
    x+='</Row>\n';
  });
  x+='</Table></Worksheet></Workbook>';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'application/vnd.ms-excel;charset=utf-8;'}));
  a.download='台股月營收_'+(S.dataMonth||'data')+'.xls';a.click();
}

// ── INIT ──
document.addEventListener('DOMContentLoaded',()=>{renderHead();loadData()});
</script>
