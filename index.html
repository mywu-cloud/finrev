*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh;transition:background-color .2s,color .2s}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px var(--shadow)}

.sp{flex:1}

.b2{background:var(--btn2);color:var(--text-strong-2)}.b2:hover{background:var(--btn2-hover)}

.b4{background:#e05252;color:#fff}.b4:hover{background:#c43a3a}

.toast{position:fixed;bottom:24px;right:24px;background:var(--btn1);color:#fff;padding:8px 18px;border-radius:6px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}

/* ── Theme toggle ── */
.thm{flex:0 0 auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:background .15s}
.thm:hover{background:var(--btn2)}
.hdr-r{text-align:right}

.tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}

@media (max-width:1024px){

body{font-size:13px}

.tb select{flex:1 1 calc(50% - 4px);min-width:0;font-size:16px;height:34px}
.tb .sp,.wt .sp{flex-basis:100%;height:0}
.tb .bt,.wt .bt{flex:1 1 0;height:34px}
.wt{flex-wrap:wrap}

.fr>label:first-child{flex-basis:100%}

#toolF>.bt{flex:1 1 100%;height:32px!important}
#toolE .sp{display:none}
#toolE .bt{flex:1 1 0;height:32px}
.st{padding:5px 12px;font-size:12px}
table{font-size:13px}
th{padding:7px 8px}td{padding:6px 8px}
/* hide rank & industry columns, pin code + name while scrolling */
#twMain th:nth-child(1),#twMain td:nth-child(1),#twE1 th:nth-child(1),#twE1 td:nth-child(1),#twE2 th:nth-child(1),#twE2 td:nth-child(1),
#twMain th:nth-child(4),#twMain td:nth-child(4),#twE1 th:nth-child(4),#twE1 td:nth-child(4),#twE2 th:nth-child(4),#twE2 td:nth-child(4){display:none}
.tw th:nth-child(2),.tw td:nth-child(2){position:sticky;left:0;z-index:2;width:56px;min-width:56px;max-width:56px}

.tw tfoot td:nth-child(2){white-space:nowrap;overflow:visible}
.toast{left:12px;right:12px;bottom:16px;text-align:center}
/* modal → full screen sheet */
.mo{padding:0;align-items:stretch}
.mo-box{max-width:none;max-height:none;height:100%;border-radius:0}
.mo-hdr{padding:12px 14px}
.mo-ytabs{padding:8px 10px 0;overflow-x:auto;gap:2px}

}
@media (max-width:380px){
.hdr h1{font-size:15px}
.tab{padding:9px 10px}
}
</style>

<script>
var PX=location.hostname.indexOf("pages.dev")>=0?"/api/proxy?url=":"https://corsproxy.io/?url=";
var TREV="https://openapi.twse.com.tw/v1/opendata/t187ap05_L";
var TPRC="https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL";
var FINFO="https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo";
var FREV="https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockMonthRevenue&data_id=";
var FPRC="https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=";
var COLS=[{k:"rank",lb:"#",al:"c"},{k:"sid",lb:"代號",al:"c"},{k:"name",lb:"名稱",al:"l"},{k:"ind",lb:"產業",al:"l"},{k:"close",lb:"收盤價",al:"r"},{k:"chg",lb:"漲跌",al:"r"},{k:"pct",lb:"漲跌幅",al:"r"},{k:"rev",lb:"月營收(億)",al:"r"},{k:"revNext",lb:"次月營收(億)",al:"r"},{k:"mom",lb:"月增率",al:"r"},{k:"yoy",lb:"年增率",al:"r"},{k:"cum",lb:"累計營收(億)",al:"r"},{k:"cumy",lb:"累計年增率",al:"r"}];
var BAD=["ETF","存託憑證","特別股","受益憑證"];
var G={tab:"twse",dmNumMap:{twse:0,tpex:0,watch:0},rows:{twse:[],tpex:[],watch:[]},sk:"rev",sd:"desc",ind:"",con:"",conMap:{},concepts:[],wl:[],dm:"",fRev:"",fMom:"",fYoy:"",fCumy:"",fYm:"",priceDate:"",fMomE:"",skE:{twse:"mom",tpex:"mom"},sdE:{twse:"desc",tpex:"desc"}};
function initG(){try{G.wl=JSON.parse(localStorage.getItem("_tw_w")||"[]");}catch(e){G.wl=[];}}
function px(u){return PX+encodeURIComponent(u);}
function ok4(c){return /^[1-9][0-9]{3}$/.test(c);}
function okN(n){for(var i=0;i<BAD.length;i++){if(n.indexOf(BAD[i])>=0)return false;}return true;}
function pf(v){if(v==null||v==="")return null;var n=parseFloat(String(v).replace(/,/g,""));return isNaN(n)?null:n;}
function f2(v){if(v==null)return"--";return parseFloat(v).toLocaleString("zh-TW",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fr(v){if(v==null)return"--";return parseFloat(v).toLocaleString("zh-TW",{minimumFractionDigits:2,maximumFractionDigits:2});}

canvas.style.width=W+"px";canvas.style.height=H+"px";
var ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);
var _nar=W<480;var pad={l:_nar?44:58,r:_nar?44:58,t:14,b:36},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b,n=data.length;
if(n<1)return;
var revs=data.map(function(d){return d.rev||0;});
var maxR=Math.max.apply(null,revs)||1,minR=Math.min.apply(null,revs);
var rPad=(maxR-minR)*0.08,rMax=maxR+rPad,rMin=Math.max(0,minR-rPad),rRange=rMax-rMin||1;
var allP=[];data.forEach(function(d){if(d.mom!=null)allP.push(d.mom);if(d.yoy!=null)allP.push(d.yoy);});
var pA=allP.length?Math.max(Math.abs(Math.max.apply(null,allP)),Math.abs(Math.min.apply(null,allP))):50;
pA=Math.max(pA,10);var pMax=Math.ceil((pA*1.1)/10)*10,pMin=-pMax;
var bW=Math.max(2,cW/n*0.72);
function xP(i){return pad.l+(i+0.5)*(cW/n);}
function yR(v){return pad.t+cH-(v-rMin)/rRange*cH;}
function yP(v){return pad.t+(1-(v-pMin)/(pMax-pMin))*cH;}
var CV=chartVars();ctx.fillStyle=CV.bg;ctx.fillRect(pad.l,pad.t,cW,cH);
ctx.strokeStyle=CV.grid;ctx.lineWidth=1;
for(var gi=0;gi<=4;gi++){var gy=pad.t+gi/4*cH;ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(pad.l+cW,gy);ctx.stroke();}
var zy=yP(0);if(zy>=pad.t&&zy<=pad.t+cH){ctx.strokeStyle=CV.zero;ctx.setLineDash([3,3]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,zy);ctx.lineTo(pad.l+cW,zy);ctx.stroke();ctx.setLineDash([]);}
for(var i=0;i<n;i++){var bx=xP(i)-bW/2,byT=yR(revs[i]),bH2=yR(rMin)-byT;ctx.fillStyle=CV.bar;ctx.fillRect(bx,byT,bW,bH2);}
ctx.strokeStyle="#e05252";ctx.lineWidth=2;ctx.setLineDash([]);ctx.beginPath();var st=false;for(var i=0;i<n;i++){if(data[i].mom==null)continue;var lx=xP(i),ly=yP(data[i].mom);if(!st){ctx.moveTo(lx,ly);st=true;}else ctx.lineTo(lx,ly);}ctx.stroke();
ctx.strokeStyle="#2a9d5c";ctx.lineWidth=2;ctx.beginPath();st=false;for(var i=0;i<n;i++){if(data[i].yoy==null)continue;var lx=xP(i),ly=yP(data[i].yoy);if(!st){ctx.moveTo(lx,ly);st=true;}else ctx.lineTo(lx,ly);}ctx.stroke();
ctx.fillStyle=CV.axis;ctx.font="11px 'Helvetica Neue',Arial,sans-serif";ctx.textAlign="center";
var step=Math.max(1,Math.ceil(n/8));for(var i=0;i<n;i+=step){ctx.fillText(data[i].label,xP(i),pad.t+cH+14);}
ctx.fillStyle=CV.axisL;ctx.textAlign="right";for(var gi=0;gi<=4;gi++){var gv=rMin+gi/4*rRange,gy=pad.t+cH-gi/4*cH;ctx.fillText(gv.toFixed(0),pad.l-6,gy+4);}
ctx.fillStyle=CV.axisR;ctx.textAlign="left";for(var gi=0;gi<=4;gi++){var gv=pMin+gi/4*(pMax-pMin),gy=pad.t+cH-gi/4*cH;ctx.fillText((gv>0?"+":"")+gv.toFixed(0)+"%",pad.l+cW+6,gy+4);}
ctx.strokeStyle=CV.frame;ctx.lineWidth=1;ctx.setLineDash([]);ctx.strokeRect(pad.l,pad.t,cW,cH);
}

async function refreshPrices(){
var st=document.getElementById("st"),prevMsg=st.textContent;
st.textContent="更新股價中...";st.className="st ld";
try{
var res=await fetch(px(TPRC)),prcArr=await res.json(),pm={};
for(var i=0;i<prcArr.length;i++){var p2=prcArr[i];if(!ok4(p2.Code))continue;var cl=pf(p2.ClosingPrice),ch=pf(p2.Change),cp=null;if(cl!=null&&ch!=null&&ch!==0){var pv=cl-ch;if(pv!==0)cp=parseFloat((ch/Math.abs(pv)*100).toFixed(2));}pm[p2.Code]={close:cl,chg:ch,pct:cp};}
for(var j=0;j<G.rows.twse.length;j++){var r=G.rows.twse[j],pr=pm[r.sid];if(pr){r.close=pr.close;r.chg=pr.chg;r.pct=pr.pct;}}
for(var w=0;w<G.rows.watch.length;w++){var wr=G.rows.watch[w],wpr=pm[wr.sid];if(wpr){wr.close=wpr.close;wr.chg=wpr.chg;wr.pct=wpr.pct;}}
renderTable(getRows());
var now=new Date(),hh=String(now.getHours()).padStart(2,"0"),mmStr=String(now.getMinutes()).padStart(2,"0");
var prtEl=document.getElementById("prt");if(!prtEl){prtEl=document.createElement("span");prtEl.id="prt";prtEl.className="prt";document.getElementById("hdrR").appendChild(prtEl);}
prtEl.textContent="股價 "+hh+":"+mmStr+" 更新";showToast("股價已更新（"+hh+":"+mmStr+"）");
st.textContent=prevMsg;st.className="st";
}catch(e){st.textContent=prevMsg;st.className="st";console.error("refreshPrices error",e);}
}
function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},3000);}
function schedulePriceRefresh(){
var targets=[19,20];
function msUntilTW(h){var twNow=new Date(Date.now()+8*3600*1000);var twT=new Date(twNow);twT.setUTCHours(0,0,5,0);twT.setTime(twT.getTime()+h*3600*1000);var diff=twT.getTime()-twNow.getTime();if(diff<=0)diff+=24*3600*1000;return diff;}
targets.forEach(function(h){var ms=msUntilTW(h);console.log("[finrev] 股價排程 "+String(h).padStart(2,"0")+":00 台灣時間，"+Math.round(ms/60000)+" 分鐘後觸發");setTimeout(function(){refreshPrices();setInterval(function(){refreshPrices();},24*3600*1000);},ms);});}
document.addEventListener("DOMContentLoaded",function(){initG();renderHead();loadData();loadConcepts();schedulePriceRefresh();document.addEventListener("keydown",function(e){if(e.key==="Escape")closeMo();});});

function chartVars(){var cs=getComputedStyle(document.documentElement);function g(n){return cs.getPropertyValue(n).trim();}return{bg:g("--ch-bg"),grid:g("--ch-grid"),zero:g("--ch-zero"),bar:g("--ch-bar"),axis:g("--ch-axis"),axisL:g("--ch-axis-l"),axisR:g("--ch-axis-r"),frame:g("--ch-frame")};}
function syncThemeBtn(){var d=document.documentElement.getAttribute("data-theme")==="dark",b=document.getElementById("thmBtn");if(!b)return;b.innerHTML=d?"&#9728;&#65039;":"&#127769;";var t=d?"切換淺色模式":"切換深色模式";b.title=t;b.setAttribute("aria-label",t);}
function applyTheme(t,persist){document.documentElement.setAttribute("data-theme",t);if(persist){try{localStorage.setItem("finrev-theme",t);}catch(e){}}syncThemeBtn();var mo=document.getElementById("mo");if(G._moData&&mo&&mo.style.display!=="none")drawMoChart(G._moData);}
function toggleTheme(){applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark",true);}
(function(){syncThemeBtn();try{var mq=matchMedia("(prefers-color-scheme: dark)");var h=function(e){var s=null;try{s=localStorage.getItem("finrev-theme");}catch(x){}if(s!=="light"&&s!=="dark")applyTheme(e.matches?"dark":"light",false);};mq.addEventListener?mq.addEventListener("change",h):mq.addListener(h);}catch(e){}var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){var mo=document.getElementById("mo");if(G._moData&&mo&&mo.style.display!=="none")drawMoChart(G._moData);},200);});})();
