<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股月營收排行系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;background:#f5f6f8;color:#222;min-height:100vh}
.hdr{background:#fff;border-bottom:1px solid #dde1e7;padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.hdr h1{font-size:17px;font-weight:700;color:#1a1a2e;white-space:nowrap}
.hdr-info{font-size:12px;color:#888;margin-left:auto;text-align:right;line-height:1.4}
.tabs{display:flex;background:#fff;border-bottom:2px solid #dde1e7;padding:0 20px}
.tab{padding:9px 18px;font-size:14px;font-family:inherit;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;color:#555;font-weight:500;margin-bottom:-2px;transition:color .15s,border-color .15s}
.tab:hover{color:#1a6fc4}
.tab.active{color:#1a6fc4;border-bottom-color:#1a6fc4;font-weight:700}
.toolbar{background:#fff;padding:8px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #eee}
select,input[type=text]{font-family:inherit;font-size:14px;padding:4px 8px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#222;height:30px}
select:focus,input:focus{outline:none;border-color:#1a6fc4}
.sp{flex:1}
.btn{font-family:inherit;font-size:13px;padding:4px 12px;border:none;border-radius:4px;cursor:pointer;height:30px;font-weight:500;transition:background .15s;white-space:nowrap}
.btn-b{background:#1a6fc4;color:#fff}.btn-b:hover{background:#155aaa}
.btn-g{background:#e8eaf0;color:#333}.btn-g:hover{background:#d0d4de}
.btn-gr{background:#2a9d5c;color:#fff}.btn-gr:hover{background:#228048}
.btn-r{background:#e05252;color:#fff}.btn-r:hover{background:#c43a3a}
.btn-sm{padding:3px 9px;font-size:12px;height:24px}
.watch-bar{background:#fff;padding:8px 20px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee}
.watch-bar input{width:110px}
.prog{height:3px;background:#e8eaf0;display:none}
.prog-bar{height:3px;background:#1a6fc4;transition:width .3s;width:0%}
.sta{padding:5px 20px;font-size:13px;color:#555;background:#fafbfc;border-bottom:1px solid #eee;min-height:26px}
.sta.ld{color:#1a6fc4}.sta.er{color:#e05252}
.tbl-wrap{overflow-x:auto;padding-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
thead tr{background:#f0f2f7}
th{padding:8px 11px;text-align:right;white-space:nowrap;font-weight:600;color:#333;border-bottom:2px solid #dde1e7;cursor:pointer;user-select:none;background:#f0f2f7}
th:hover{background:#e4e7f0}
th.l{text-align:left}
th.c{text-align:center}
.si{margin-left:3px;font-size:10px;color:#aaa}
th.sa .si,th.sd .si{color:#1a6fc4}
td{padding:7px 11px;border-bottom:1px solid #eeeff3;text-align:right;vertical-align:middle;white-space:nowrap}
td.l{text-align:left}
td.c{text-align:center}
tr:hover td{background:#f7f9fd}
.sid{font-weight:600;color:#1a6fc4}
.sn{font-weight:500}
.ind{font-size:12px;color:#999;margin-top:1px}
.up{color:#d9363e}.dn{color:#389d59}.neu{color:#888}
.rk{color:#aaa;font-size:13px}
tfoot td{background:#f0f2f7;font-weight:600;border-top:2px solid #dde1e7;font-size:13px}
.empty{padding:40px;text-align:center;color:#aaa;font-size:15px}
@media(max-width:700px){th,td{padding:6px 7px;font-size:13px}}
</style>
</head>
<body>
<div class="hdr">
  <h1>📊 台股月營收排行</h1>
  <div class="hdr-info" id="hdrInfo">--</div>
</div>
<div class="tabs">
  <button class="tab active" id="tb-twse" onclick="switchTab('twse')">上市 (TWSE)</button>
  <button class="tab" id="tb-tpex" onclick="switchTab('tpex')">上櫃 (TPEx)</button>
  <button class="tab" id="tb-watch" onclick="switchTab('watch')">⭐ 自選股</button>
</div>
<div class="toolbar" id="toolMain">
  <label style="font-size:14px;color:#555;font-weight:500">產業：</label>
  <select id="indSel" onchange="onInd()"><option value="">全部產業</option></select>
  <span class="sp"></span>
  <button class="btn btn-g" onclick="dlCSV()">⬇ CSV</button>
  <button class="btn btn-g" onclick="dlXLS()">⬇ XLS</button>
  <button class="btn btn-b" onclick="reload()">🔄 重新載入</button>
</div>
<div class="watch-bar" id="toolWatch" style="display:none">
  <input id="wInp" type="text" placeholder="股票代號（4碼）" maxlength="6"
    onkeydown="if(event.key==='Enter')addWatch()">
  <button class="btn btn-gr" onclick="addWatch()">＋ 新增</button>
  <span class="sp"></span>
  <button class="btn btn-g" onclick="dlCSV()">⬇ CSV</button>
  <button class="btn btn-g" onclick="dlXLS()">⬇ XLS</button>
  <button class="btn btn-r btn-sm" onclick="clearWatch()">全部清除</button>
</div>
<div class="prog" id="prog"><div class="prog-bar" id="progBar"></div></div>
<div class="sta" id="sta">初始化中...</div>
<div class="tbl-wrap">
  <table id="mainTbl">
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
    <tfoot id="tfoot"></tfoot>
  </table>
</div><script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const PROXY = 'https://corsproxy.io/?url=';
const TWSE_REV_URL  = 'https://openapi.twse.com.tw/v1/opendata/t187ap05_L';
const TWSE_PRC_URL  = 'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL';
const TPEX_INFO_URL = 'https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo';
const FM_REV_BASE   = 'https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockMonthRevenue&data_id=';
const FM_PRC_BASE   = 'https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=';
const px = url => PROXY + encodeURIComponent(url);

const COLS = [
  {k:'rank',   lb:'#',          al:'c', sort:true},
  {k:'sid',    lb:'代號',       al:'c', sort:true},
  {k:'name',   lb:'名稱',       al:'l', sort:true},
  {k:'close',  lb:'收盤價',     al:'r', sort:true},
  {k:'chg',    lb:'漲跌',       al:'r', sort:true},
  {k:'chgpct', lb:'漲跌幅',     al:'r', sort:true},
  {k:'rev',    lb:'月營收(億)', al:'r', sort:true},
  {k:'mom',    lb:'月增率',     al:'r', sort:true},
  {k:'yoy',    lb:'年增率',     al:'r', sort:true},
  {k:'cumrev', lb:'累計營收(億)',al:'r', sort:true},
  {k:'cumyoy', lb:'累計年增率', al:'r', sort:true},
];

const EXCL = ['ETF','存託憑證','特別股','受益憑證'];
const okName = n => !EXCL.some(w=>n.includes(w));
const is4d   = c => /^[1-9][0-9]{3}$/.test(c);

// ─── STATE ───────────────────────────────────────────────────────────────────
const S = {
  tab: 'twse',
  rows: {twse:[], tpex:[], watch:[]},
  sortK: 'rev', sortD: 'desc',
  ind: '',
  watch: JSON.parse(localStorage.getItem('_twrev_watch')||'[]'),
  dataMonth: '',
};

// ─── UTILS ───────────────────────────────────────────────────────────────────
const pf=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:n};
const f2=v=>v==null?'--':parseFloat(v).toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2});
const frev=v=>v==null?'--':(v/1e8).toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2});
const fpct=v=>{if(v==null)return'--';const n=parseFloat(v);return(n>0?'+':'')+n.toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'};
const cc=v=>v==null?'neu':v>0?'up':'down';
const ROC_YM=ym=>{if(!ym||ym.length<5)return'';const y=parseInt(ym.slice(0,3));const m=ym.slice(3,5);return(1911+y)+'年'+(parseInt(m))+'月'};

// ─── PROGRESS ────────────────────────────────────────────────────────────────
const prog=(pct,msg,cls)=>{
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('prog').style.display='block';
  const s=document.getElementById('sta');s.textContent=msg;s.className='sta '+(cls||'ld');
};
const done=(msg)=>{
  document.getElementById('prog').style.display='none';
  document.getElementById('progBar').style.width='0%';
  const s=document.getElementById('sta');s.textContent=msg;s.className='sta';
};

// ─── FETCH TWSE DATA (one-shot) ───────────────────────────────────────────────
async function loadTWSE(){
  prog(5,'取得上市公司月營收...');
  const [revRes, prcRes] = await Promise.all([
    fetch(px(TWSE_REV_URL)),
    fetch(px(TWSE_PRC_URL)),
  ]);
  const revData = await revRes.json();   // t187ap05_L
  const prcData = await prcRes.json();   // STOCK_DAY_ALL

  prog(60,'解析上市公司資料...');
  // Price map
  const pMap = {};
  for (const p of prcData) {
    if (!is4d(p.Code)||!okName(p.Name||'')) continue;
    const close = pf(p.ClosingPrice);
    const change = pf(p.Change);
    let chgpct = null;
    if (close!=null&&change!=null&&change!==0) {
      const prev = close - change;
      if (prev!==0) chgpct = parseFloat((change/Math.abs(prev)*100).toFixed(2));
    }
    pMap[p.Code] = {close, chg:change, chgpct};
  }

  // Parse date
  let dataMonth = '';

  // Build rows
  const rows = [];
  for (const item of revData) {
    const code = (item['公司代號']||'').trim();
    const name = (item['公司名稱']||'').trim();
    if (!is4d(code)||!okName(name)) continue;
    const rev    = pf(item['營業收入-當月營收']);
    if (rev == null) continue;
    const mom    = pf(item['營業收入-上月比較增減(%)']);
    const yoy    = pf(item['營業收入-去年同月增減(%)']);
    const cumrev = pf(item['累計營業收入-當月累計營收']);
    const cumyoy = pf(item['累計營業收入-前期比較增減(%)']);
    const ind    = (item['產業別']||'').trim();
    const ym     = (item['資料年月']||'').trim();
    if (ym && !dataMonth) dataMonth = ROC_YM(ym);
    const price  = pMap[code] || {};
    rows.push({sid:code, name, ind, close:price.close, chg:price.chg, chgpct:price.chgpct, rev, mom, yoy, cumrev, cumyoy});
  }
  if (dataMonth) S.dataMonth = dataMonth;
  S.rows.twse = rows;
  prog(100,'');
  populateInd('twse');
  renderTable(getRows());
  done('上市：共 '+rows.length+' 檔，資料月份：'+dataMonth);
  document.getElementById('hdrInfo').textContent='資料月份：'+dataMonth;
}
// ─── FETCH TPEX DATA (FinMind via proxy) ─────────────────────────────────────
async function loadTPEx(){
  prog(5,'取得上櫃股票清單（FinMind）...');
  // Get TPEx stock info
  const infoRes = await fetch(px(TPEX_INFO_URL));
  const infoData = await infoRes.json();
  const tpexStocks = (infoData.data||[]).filter(s=>is4d(s.stock_id)&&okName(s.stock_name||'')&&s.type==='tpex');
  prog(10,'已取得 '+tpexStocks.length+' 支上櫃股票，載入月營收...');

  // Get today's date and start date for 14 months of data (for MoM, YoY, cumulative)
  const now = new Date();
  const prevYear = now.getFullYear()-1;
  const twoBack  = now.getFullYear()-2;
  // For MoM + YoY: need prior year same month
  // Current date: 2026-06, so latest data should be 2026/5
  // We need 2025/5 for YoY, 2026/4 for MoM, and 2025/1-5 for cumulative comparison
  // Start from 2025-01 to cover all cases
  const startDate = prevYear + '-01-01';
  const priceStart = now.getFullYear()+'-'+(String(now.getMonth()+1).padStart(2,'0'))+'-01';

  const BATCH = 30;
  const rows = [];
  let done2 = 0;
  let dataMonth = '';

  for (let i = 0; i < tpexStocks.length; i += BATCH) {
    const batch = tpexStocks.slice(i, i+BATCH);
    const bRes = await Promise.all(batch.map(async s => {
      const url = FM_REV_BASE + s.stock_id + '&start_date=' + startDate;
      try {
        const r = await fetch(px(url));
        const d = await r.json();
        return { s, revRows: d.status===200?(d.data||[]):[] };
      } catch { return { s, revRows: [] }; }
    }));
    for (const {s, revRows} of bRes) {
      if (!revRows.length) continue;
      // Sort asc by year+month
      const sorted = revRows.slice().sort((a,b)=>a.revenue_year!==b.revenue_year?a.revenue_year-b.revenue_year:a.revenue_month-b.revenue_month);
      const map = {};
      sorted.forEach(r=>{map[r.revenue_year+'_'+r.revenue_month]=r.revenue});
      const last = sorted[sorted.length-1];
      const y=last.revenue_year, m=last.revenue_month;
      const rev = last.revenue;
      const prevMrev = m>1?map[y+'_'+(m-1)]:map[(y-1)+'_12'];
      const mom = prevMrev!=null?parseFloat(((rev-prevMrev)/Math.abs(prevMrev)*100).toFixed(2)):null;
      const prevYrev = map[(y-1)+'_'+m];
      const yoy = prevYrev!=null?parseFloat(((rev-prevYrev)/Math.abs(prevYrev)*100).toFixed(2)):null;
      let cumrev=0; for(let mo=1;mo<=m;mo++){const v=map[y+'_'+mo];if(v)cumrev+=v}
      let cumprev=0; for(let mo=1;mo<=m;mo++){const v=map[(y-1)+'_'+mo];if(v)cumprev+=v}
      const cumyoy = cumprev?parseFloat(((cumrev-cumprev)/Math.abs(cumprev)*100).toFixed(2)):null;
      if (!dataMonth) dataMonth = y+'年'+m+'月';
      rows.push({sid:s.stock_id, name:s.stock_name, ind:s.industry_category||'', close:null, chg:null, chgpct:null, rev, mom, yoy, cumrev, cumyoy});
    }
    done2 += batch.length;
    const pct = 10 + Math.round(done2/tpexStocks.length*75);
    prog(pct,'上櫃載入中 '+done2+'/'+tpexStocks.length+'，已有 '+rows.length+' 筆');
    // Progressive render
    if (rows.length && done2%150===0) {
      S.rows.tpex=[...rows];
      if(S.tab==='tpex'){populateInd('tpex');renderTable(getRows());}
    }
  }

  if (dataMonth) S.dataMonth = dataMonth;
  S.rows.tpex = rows;
  populateInd('tpex');
  renderTable(getRows());
  done('上櫃：共 '+rows.length+' 檔，資料月份：'+dataMonth);
  document.getElementById('hdrInfo').textContent='資料月份：'+dataMonth;
}
// ─── WATCHLIST ────────────────────────────────────────────────────────────────
async function loadWatch(){
  const ids = S.watch;
  if (!ids.length) {
    S.rows.watch = [];
    renderTable([]);
    done('自選股：尚未新增股票');
    return;
  }
  prog(5,'取得自選股資料...');

  const now = new Date();
  const startDate = (now.getFullYear()-1)+'-01-01';
  const priceStart = now.getFullYear()+'-'+(String(now.getMonth()+1).padStart(2,'0'))+'-01';

  // Load both TWSE bulk data and TPEx info
  const [twseRevRes, twsePrcRes, tpexInfoRes] = await Promise.all([
    fetch(px(TWSE_REV_URL)).catch(()=>null),
    fetch(px(TWSE_PRC_URL)).catch(()=>null),
    fetch(px(TPEX_INFO_URL)).catch(()=>null),
  ]);
  prog(40,'解析股票資料...');
  
  let twseRevMap={}, twsePrcMap={};
  if (twseRevRes) {
    const d = await twseRevRes.json();
    d.forEach(item=>{
      const code=(item['公司代號']||'').trim();
      if(is4d(code)) {
        twseRevMap[code]={
          rev:pf(item['營業收入-當月營收']),
          mom:pf(item['營業收入-上月比較增減(%)']),
          yoy:pf(item['營業收入-去年同月增減(%)']),
          cumrev:pf(item['累計營業收入-當月累計營收']),
          cumyoy:pf(item['累計營業收入-前期比較增減(%)']),
          name:item['公司名稱'],ind:item['產業別'],
        };
      }
    });
  }
  if (twsePrcRes) {
    const d = await twsePrcRes.json();
    d.forEach(p=>{
      if(!is4d(p.Code)) return;
      const close=pf(p.ClosingPrice), change=pf(p.Change);
      let chgpct=null;
      if(close!=null&&change!=null&&change!==0){const prev=close-change;if(prev!==0)chgpct=parseFloat((change/Math.abs(prev)*100).toFixed(2));}
      twsePrcMap[p.Code]={close,chg:change,chgpct};
    });
  }
  const tpexInfo={};
  if(tpexInfoRes){const d=await tpexInfoRes.json();(d.data||[]).forEach(s=>{if(is4d(s.stock_id))tpexInfo[s.stock_id]=s});}

  prog(60,'取得自選股月營收...');
  const rows = await Promise.all(ids.map(async id => {
    // Try TWSE data first
    if (twseRevMap[id]) {
      const rv=twseRevMap[id], pr=twsePrcMap[id]||{};
      return {sid:id,name:rv.name||id,ind:rv.ind||'',close:pr.close,chg:pr.chg,chgpct:pr.chgpct,rev:rv.rev,mom:rv.mom,yoy:rv.yoy,cumrev:rv.cumrev,cumyoy:rv.cumyoy};
    }
    // Try TPEx via FinMind
    const info = tpexInfo[id];
    try {
      const revUrl = FM_REV_BASE+id+'&start_date='+startDate;
      const prcUrl = FM_PRC_BASE+id+'&start_date='+priceStart;
      const [revRes2, prcRes2] = await Promise.all([fetch(px(revUrl)), fetch(px(prcUrl))]);
      const revD=await revRes2.json(), prcD=await prcRes2.json();
      const revRows=(revD.data||[]).sort((a,b)=>a.revenue_year!==b.revenue_year?a.revenue_year-b.revenue_year:a.revenue_month-b.revenue_month);
      if (!revRows.length) return {sid:id,name:info?.stock_name||id,ind:info?.industry_category||'',close:null,chg:null,chgpct:null,rev:null,mom:null,yoy:null,cumrev:null,cumyoy:null};
      const map={};revRows.forEach(r=>{map[r.revenue_year+'_'+r.revenue_month]=r.revenue});
      const last=revRows[revRows.length-1],y=last.revenue_year,m=last.revenue_month,rev=last.revenue;
      const prevM=m>1?map[y+'_'+(m-1)]:map[(y-1)+'_12'];
      const mom2=prevM!=null?parseFloat(((rev-prevM)/Math.abs(prevM)*100).toFixed(2)):null;
      const prevY=map[(y-1)+'_'+m];
      const yoy2=prevY!=null?parseFloat(((rev-prevY)/Math.abs(prevY)*100).toFixed(2)):null;
      let cr=0;for(let mo=1;mo<=m;mo++){const v=map[y+'_'+mo];if(v)cr+=v}
      let cp=0;for(let mo=1;mo<=m;mo++){const v=map[(y-1)+'_'+mo];if(v)cp+=v}
      const cumyoy2=cp?parseFloat(((cr-cp)/Math.abs(cp)*100).toFixed(2)):null;
      const prices=(prcD.data||[]);
      const lastP=prices[prices.length-1]||{},prevP=prices[prices.length-2];
      let close2=lastP.close||null,chg2=null,chgpct2=null;
      if(prevP&&prevP.close&&close2!=null){chg2=parseFloat((close2-prevP.close).toFixed(2));chgpct2=parseFloat((chg2/prevP.close*100).toFixed(2));}
      return {sid:id,name:info?.stock_name||id,ind:info?.industry_category||'',close:close2,chg:chg2,chgpct:chgpct2,rev,mom:mom2,yoy:yoy2,cumrev:cr||null,cumyoy:cumyoy2};
    } catch { return {sid:id,name:info?.stock_name||id,ind:'',close:null,chg:null,chgpct:null,rev:null,mom:null,yoy:null,cumrev:null,cumyoy:null}; }
  }));
  S.rows.watch=rows;
  renderTable(getRows());
  done('自選股：'+rows.length+' 支，資料月份：'+S.dataMonth);
}

const saveWatch=()=>localStorage.setItem('_twrev_watch',JSON.stringify(S.watch));
function addWatch(){
  const inp=document.getElementById('wInp');
  const code=inp.value.trim().toUpperCase();inp.value='';
  if(!code)return;
  if(!is4d(code)){alert('請輸入4碼數字股票代號');return}
  if(S.watch.includes(code)){alert(code+' 已在自選股');return}
  S.watch.push(code);saveWatch();
  if(S.tab==='watch')loadWatch();
}
function removeWatch(code){S.watch=S.watch.filter(id=>id!==code);saveWatch();if(S.tab==='watch')loadWatch()}
function clearWatch(){if(!confirm('確定清除全部自選股？'))return;S.watch=[];saveWatch();S.rows.watch=[];renderTable([]);done('自選股已清空')}
// ─── RENDER ───────────────────────────────────────────────────────────────────
function getRows(){
  let rows=[...(S.rows[S.tab]||[])];
  if(S.tab!=='watch'&&S.ind) rows=rows.filter(r=>r.ind===S.ind);
  rows.sort((a,b)=>{
    const d=S.sortD==='asc'?1:-1;
    if(S.sortK==='name'){return d*(a.name||'').localeCompare(b.name||'','zh-TW')}
    if(S.sortK==='sid'){return d*(a.sid||'').localeCompare(b.sid||'')}
    const av=a[S.sortK],bv=b[S.sortK];
    if(av==null)return 1;if(bv==null)return-1;
    return d*(parseFloat(av)-parseFloat(bv));
  });
  return rows;
}

function populateInd(tab){
  const sel=document.getElementById('indSel');
  const inds=[...new Set((S.rows[tab]||[]).map(r=>r.ind).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-TW'));
  sel.innerHTML='<option value="">全部產業</option>';
  inds.forEach(ind=>{const o=document.createElement('option');o.value=ind;o.textContent=ind;if(ind===S.ind)o.selected=true;sel.appendChild(o)});
}

function renderHead(){
  const tr=document.createElement('tr');
  COLS.forEach(col=>{
    const th=document.createElement('th');
    th.className=col.al;
    if(col.sort){th.style.cursor='pointer';th.onclick=()=>doSort(col.k);}
    if(S.sortK===col.k)th.classList.add(S.sortD==='asc'?'sa':'sd');
    const ico=col.sort?(S.sortK===col.k?(S.sortD==='asc'?'▲':'▼'):'⇅'):'';
    th.innerHTML=col.lb+'<span class="si">'+ico+'</span>';
    tr.appendChild(th);
  });
  const th=document.getElementById('thead');th.innerHTML='';th.appendChild(tr);
}

function renderBody(rows){
  const tb=document.getElementById('tbody');
  if(!rows.length){tb.innerHTML='<tr><td colspan="'+COLS.length+'" class="empty">無資料</td></tr>';return}
  const f=document.createDocumentFragment();
  rows.forEach((row,idx)=>{
    const tr=document.createElement('tr');
    COLS.forEach(col=>{
      const td=document.createElement('td');td.className=col.al;
      switch(col.k){
        case'rank':td.innerHTML='<span class="rk">'+(idx+1)+'</span>';break;
        case'sid':td.innerHTML='<span class="sid">'+row.sid+'</span>';break;
        case'name':td.className='l';td.innerHTML='<div class="sn">'+(row.name||'--')+'</div>'+(row.ind?'<div class="ind">'+row.ind+'</div>':'');break;
        case'close':td.textContent=f2(row.close);break;
        case'chg':td.className='r '+cc(row.chg);td.textContent=row.chg!=null?(row.chg>0?'+':'')+f2(row.chg):'--';break;
        case'chgpct':td.className='r '+cc(row.chgpct);td.textContent=fpct(row.chgpct);break;
        case'rev':td.textContent=frev(row.rev);break;
        case'mom':td.className='r '+cc(row.mom);td.textContent=fpct(row.mom);break;
        case'yoy':td.className='r '+cc(row.yoy);td.textContent=fpct(row.yoy);break;
        case'cumrev':td.textContent=frev(row.cumrev);break;
        case'cumyoy':td.className='r '+cc(row.cumyoy);td.textContent=fpct(row.cumyoy);break;
      }
      if(S.tab==='watch'&&col.k==='cumyoy'){
        const orig=td.textContent;
        const btn=document.createElement('button');
        btn.className='btn btn-r btn-sm';btn.style.marginLeft='6px';btn.textContent='✕';
        btn.onclick=e=>{e.stopPropagation();removeWatch(row.sid)};
        td.textContent='';
        const sp=document.createElement('span');sp.textContent=orig;
        td.appendChild(sp);td.appendChild(btn);
      }
      tr.appendChild(td);
    });
    f.appendChild(tr);
  });
  tb.innerHTML='';tb.appendChild(f);
}

function renderFoot(rows){
  const tf=document.getElementById('tfoot');
  if(!rows.length){tf.innerHTML='';return}
  const totRev=rows.reduce((s,r)=>r.rev?(s+r.rev):s,0);
  const yoys=rows.filter(r=>r.yoy!=null).map(r=>r.yoy);
  const avgYoy=yoys.length?yoys.reduce((a,b)=>a+b,0)/yoys.length:null;
  const up=rows.filter(r=>r.yoy!=null&&r.yoy>0).length;
  const dn=rows.filter(r=>r.yoy!=null&&r.yoy<0).length;
  const tr=document.createElement('tr');
  COLS.forEach((col,i)=>{
    const td=document.createElement('td');td.className=col.al;
    if(i===1)td.textContent='合計/平均';
    else if(col.k==='rev')td.textContent=frev(totRev);
    else if(col.k==='yoy'){td.textContent=avgYoy!=null?fpct(avgYoy)+' 均':'-';td.className='r '+cc(avgYoy)}
    else if(col.k==='mom')td.textContent='▲'+up+' ▼'+dn;
    else td.textContent='';
    tr.appendChild(td);
  });
  tf.innerHTML='';tf.appendChild(tr);
}

function renderTable(rows){renderHead();renderBody(rows);renderFoot(rows)}
function doSort(k){if(S.sortK===k)S.sortD=S.sortD==='asc'?'desc':'asc';else{S.sortK=k;S.sortD='desc'}renderTable(getRows())}
function onInd(){S.ind=document.getElementById('indSel').value;renderTable(getRows())}

// ─── TABS & MAIN ─────────────────────────────────────────────────────────────
function switchTab(tab){
  S.tab=tab;S.ind='';
  ['twse','tpex','watch'].forEach(t=>document.getElementById('tb-'+t).classList.toggle('active',t===tab));
  const iw=tab==='watch';
  document.getElementById('toolMain').style.display=iw?'none':'flex';
  document.getElementById('toolWatch').style.display=iw?'flex':'none';
  document.getElementById('indSel').value='';
  if(S.rows[tab]&&S.rows[tab].length>0){if(!iw)populateInd(tab);renderTable(getRows())}
  else loadData();
}

async function loadData(){
  try{
    if(S.tab==='twse')await loadTWSE();
    else if(S.tab==='tpex')await loadTPEx();
    else await loadWatch();
  }catch(e){
    const s=document.getElementById('sta');s.textContent='載入失敗：'+e.message;s.className='sta er';
    document.getElementById('prog').style.display='none';
    console.error(e);
  }
}

function reload(){S.rows[S.tab]=[];loadData()}

// ─── DOWNLOAD ─────────────────────────────────────────────────────────────────
function getTblData(){
  const rows=getRows();
  const h=COLS.map(c=>c.lb);
  const d=rows.map((r,i)=>[i+1,r.sid,(r.name||'')+(r.ind?' ('+r.ind+')'):'',
    r.close!=null?parseFloat(r.close).toFixed(2):'',
    r.chg!=null?((r.chg>0?'+':'')+parseFloat(r.chg).toFixed(2)):'',
    r.chgpct!=null?parseFloat(r.chgpct).toFixed(2)+'%':'',
    r.rev!=null?(r.rev/1e8).toFixed(2):'',
    r.mom!=null?parseFloat(r.mom).toFixed(2)+'%':'',
    r.yoy!=null?parseFloat(r.yoy).toFixed(2)+'%':'',
    r.cumrev!=null?(r.cumrev/1e8).toFixed(2):'',
    r.cumyoy!=null?parseFloat(r.cumyoy).toFixed(2)+'%':'',
  ]);
  return{h,d};
}
function dlCSV(){
  const{h,d}=getTblData();
  let c='\uFEFF'+h.join(',')+'\n';
  d.forEach(r=>{c+=r.map(v=>{const s=String(v??'');return(s.includes(',')||s.includes('"'))?'"'+s.replace(/"/g,'""')+'"':s}).join(',')+'\n'});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv;charset=utf-8;'}));
  a.download='台股月營收_'+(S.dataMonth||'data')+'.csv';a.click();
}
function dlXLS(){
  const{h,d}=getTblData();
  let x='<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n<Worksheet ss:Name="月營收"><Table>\n';
  [h,...d].forEach(r=>{x+='<Row>'+r.map(v=>'<Cell><Data ss:Type="String">'+String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</Data></Cell>').join('')+'</Row>\n'});
  x+='</Table></Worksheet></Workbook>';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'application/vnd.ms-excel;charset=utf-8;'}));
  a.download='台股月營收_'+(S.dataMonth||'data')+'.xls';a.click();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{renderHead();loadData()});
</script>
</body>
</html>
